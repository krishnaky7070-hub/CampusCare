<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusCare - Track Issue</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        <i class="fa-solid fa-hand-holding-heart"></i>
        CampusCare
    </div>

    <a href="index.html" class="nav-link">
        <i class="fa-solid fa-arrow-left"></i>
        Student Portal
    </a>

</nav>

<section class="tracking-page">

    <div class="tracking-header">

        <i class="fa-solid fa-location-dot tracking-icon"></i>

        <h1>Track Your Issue</h1>

        <p>
            Enter your tracking ID to see the latest update on your complaint.
        </p>

    </div>

    <!-- Search -->

    <div class="tracking-search">

        <input
            type="text"
            id="trackingInput"
            placeholder="Enter tracking ID e.g. CC-123456"
        >

        <button onclick="trackIssue()">
            <i class="fa-solid fa-magnifying-glass"></i>
            Track Issue
        </button>

    </div>

    <div id="trackingResult"></div>

</section>

<script src="track.js"></script>

</body>
</html>
